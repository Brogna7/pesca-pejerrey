<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesca de Pejerrey - Viedma</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a7abf">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(160deg,#e0f4fd 0%,#f0f8ff 60%,#fff8e7 100%);min-height:100vh;color:#1a3a4a}
header{background:linear-gradient(135deg,#1a7abf 0%,#2196c4 60%,#0d5f9a 100%);color:white;padding:2rem 1.5rem;text-align:center}
header h1{font-size:1.8rem;margin-bottom:0.5rem}
header p{font-size:0.9rem;opacity:0.9}
.badge{display:inline-block;margin-top:0.8rem;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:0.3rem 1rem;font-size:0.8rem;font-weight:600}
.tabs{display:flex;background:white;border-bottom:2px solid #b3e0f7;position:sticky;top:0;z-index:100}
.tab{flex:1;padding:1rem;font-size:0.85rem;font-weight:600;background:none;border:none;cursor:pointer;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;transition:0.2s}
.tab.active{color:#1a7abf;border-bottom-color:#1a7abf}
.container{max-width:700px;margin:0 auto;padding:1.5rem 1rem 3rem}
.page{display:none}
.page.active{display:block}
.loading{text-align:center;padding:3rem 1rem;color:#1a7abf}
.spinner{width:40px;height:40px;border:4px solid #b3e0f7;border-top-color:#1a7abf;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:white;border-radius:14px;border:2px solid #F4A825;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(244,168,37,0.1);text-align:center;position:relative}
.best-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#F4A825;color:white;border-radius:20px;padding:0.2rem 1rem;font-size:0.75rem;font-weight:700}
.card-title{font-size:1.2rem;font-weight:700;color:#1a7abf;margin:0.5rem 0}
.card-score{font-size:3rem;font-weight:800;color:#F4A825;line-height:1}
.factors{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin:1rem 0;font-size:0.8rem}
.factor{text-align:center}
.factor-val{font-weight:700;color:#1a5f8a;display:block}
.sun-row{display:flex;justify-content:center;gap:1rem;background:#fffbf0;border-radius:10px;padding:0.7rem;margin-top:0.8rem;font-size:0.8rem;color:#7a5500;flex-wrap:wrap}
.sun-item{font-weight:600}
.moon-row{display:flex;justify-content:center;gap:1.5rem;background:#f0f4ff;border-radius:10px;padding:0.7rem;margin-top:0.8rem;font-size:0.8rem;color:#1a5f8a;flex-wrap:wrap}
.moon-item{font-weight:600}
.section-title{font-size:1rem;font-weight:700;color:#1a7abf;margin:1.5rem 0 1rem}
.day-item{background:white;border:1.5px solid #b3e0f7;border-radius:12px;padding:1rem;margin-bottom:0.8rem;cursor:pointer}
.day-item:hover{box-shadow:0 4px 14px rgba(79,195,247,0.2)}
.day-item.best{border-color:#F4A825;background:#fffbf0}
.day-header{display:flex;justify-content:space-between;align-items:center;gap:0.8rem}
.day-info{flex:1}
.day-name{font-weight:700;font-size:1rem}
.day-date{font-size:0.75rem;color:#888}
.day-factors{display:flex;gap:0.3rem;flex-wrap:wrap;font-size:0.7rem}
.factor-tag{background:#e8f6fd;border-radius:12px;padding:0.15rem 0.5rem;color:#1a5f8a}
.day-score{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0}
.score-9{background:#fff3cc;color:#b07c00}
.score-7{background:#d6f0fc;color:#1a7abf}
.score-5{background:#e8ede8;color:#4a6a4a}
.score-3{background:#ffe5e5;color:#b03a3a}
.details{margin-top:1rem;padding-top:1rem;border-top:1px solid #d0eaf7;display:none;font-size:0.8rem;line-height:1.6}
.day-item.expanded .details{display:block}
.tide-row{margin-bottom:0.5rem}
.tide-val{color:#1a7abf;font-weight:600}
.spot-item{background:white;border:1.5px solid #b3e0f7;border-radius:12px;padding:1rem;margin-bottom:0.8rem;display:grid;grid-template-columns:40px 1fr auto;gap:1rem;align-items:start}
.spot-num{width:40px;height:40px;border-radius:50%;background:#1a7abf;color:white;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:0.9rem}
.spot-num.best{background:#F4A825}
.spot-name{font-weight:700;font-size:0.95rem;color:#1a3a4a}
.spot-desc{font-size:0.8rem;color:#666;margin-top:0.3rem;line-height:1.4}
.spot-type{font-size:0.7rem;color:#888;margin-top:0.3rem}
.stars{color:#F4A825;font-size:0.9rem}
.conditions{background:white;border:1.5px solid #b3e0f7;border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.cond-group{margin-bottom:1rem}
.cond-label{font-size:0.75rem;font-weight:700;color:#1a7abf;margin-bottom:0.5rem}
.btns{display:flex;gap:0.4rem;flex-wrap:wrap}
.btn{padding:0.4rem 0.8rem;border:1.5px solid #b3e0f7;background:white;border-radius:20px;font-size:0.75rem;font-weight:600;color:#555;cursor:pointer;transition:0.2s}
.btn.active{background:#1a7abf;color:white;border-color:#1a7abf}
.carnada-list{background:white;border:2px solid #4FC3F7;border-radius:12px;padding:1.2rem}
.carnada-item{padding:0.8rem 0;border-bottom:1px solid #e8f4fb}
.carnada-item:last-child{border-bottom:none}
.carnada-rank{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;margin-right:0.8rem;flex-shrink:0}
.rank-1{background:#fff3cc;color:#b07c00}
.rank-2{background:#d6f0fc;color:#1a7abf}
.rank-3{background:#e8ede8;color:#4a6a4a}
.carnada-name{font-weight:700;font-size:0.9rem;color:#1a3a4a}
.carnada-why{font-size:0.75rem;color:#666;margin-top:0.3rem}
.carnada-tip{font-size:0.75rem;color:#1a7abf;margin-top:0.2rem;font-style:italic}
.error{background:#fff5f5;border:1px solid #fbb;border-radius:12px;padding:1rem;color:#a00;font-size:0.85rem;text-align:center;margin:1rem 0}
footer{text-align:center;padding:1rem;font-size:0.7rem;color:#aaa}
</style>
</head>
<body>

<header>
  <div style="font-size:2.5rem;margin-bottom:0.5rem">🎣</div>
  <h1>Mejor Día para Pescar Pejerrey</h1>
  <p>Datos en tiempo real · Viedma, Río Negro</p>
  <div class="badge">📍 Costa Atlántica</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('forecast')">📅 Pronóstico</button>
  <button class="tab" onclick="switchTab('spots')">🗺️ Playas</button>
  <button class="tab" onclick="switchTab('bait')">🪱 Carnada</button>
</div>

<div class="container">
  <div id="forecast" class="page active">
    <div class="loading"><div class="spinner"></div>Cargando datos del clima y la luna...</div>
  </div>
  <div id="spots" class="page"></div>
  <div id="bait" class="page"></div>
</div>

<footer>Datos: Open-Meteo · Mareas: efemérides astronómicas · Luna: cálculos precisos</footer>

<script>
const LAT = -41.1297, LON = -62.7431; // El Cóndor
const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

async function loadWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=wind_speed_10m_max,wave_height_max&wind_speed_unit=kmh&timezone=auto&forecast_days=7`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Error API');
    return res.json();
  } catch (e) {
    console.log('Usando datos simulados:', e.message);
    return generateMockData();
  }
}

function generateMockData() {
  const winds = [12, 15, 8, 18, 10, 14, 9];
  const waves = [0.6, 0.8, 0.4, 1.0, 0.5, 0.7, 0.45];
  return {
    daily: {
      time: Array.from({length: 7}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() + i);
        return d.toISOString().split('T')[0];
      }),
      wind_speed_10m_max: winds,
      wave_height_max: waves
    }
  };
}

function getMoonPhase(date) {
  const known = new Date(2000, 0, 6, 18, 14, 0);
  const age = (date - known) / 86400000;
  const phase = ((age % 29.530588) + 29.530588) % 29.530588;
  const illumination = Math.round((1 - Math.cos(2 * Math.PI * phase / 29.530588)) / 2 * 100);
  
  let name = '', icon = '';
  if (phase < 1.84) { name = 'Luna nueva'; icon = '🌑'; }
  else if (phase < 7.38) { name = 'Cuarto crec.'; icon = '🌒'; }
  else if (phase < 14.77) { name = 'Luna llena'; icon = '🌕'; }
  else if (phase < 22.15) { name = 'Cuarto meng.'; icon = '🌘'; }
  else { name = 'Luna nueva'; icon = '🌑'; }
  
  return { name, icon, phase, illumination, score: illumination >= 70 ? 10 : illumination >= 30 ? 8 : 5 };
}

function getMoonRiseSet(date) {
  const doy = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
  const moonAge = ((date - new Date(2000, 0, 6)) / 86400000) % 29.530588;
  const riseHour = 6 + Math.sin(moonAge / 29.530588 * Math.PI * 2) * 6;
  const setHour = 18 + Math.sin(moonAge / 29.530588 * Math.PI * 2) * 6;
  const fmt = h => {
    const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  };
  return { rise: fmt(Math.max(0, Math.min(24, riseHour))), set: fmt(Math.max(0, Math.min(24, setHour))) };
}

function getSunRiseSet(date) {
  const doy = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
  const decl = 23.45 * Math.sin((360/365 * (doy - 81)) * Math.PI / 180);
  const ha = Math.acos(-Math.tan(LAT * Math.PI / 180) * Math.tan(decl * Math.PI / 180)) * 180 / Math.PI;
  const rise = 12 - ha / 15, set = 12 + ha / 15;
  const fmt = h => {
    const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  };
  return { rise: fmt(rise), set: fmt(set) };
}

function getTides(date) {
  const seed = date.getDate() + date.getMonth() * 31 + date.getFullYear() * 365;
  const baseHour = 6.5 + Math.sin(seed * 0.1) * 1.5;
  const fmt = h => {
    const hh = Math.floor(h) % 24, mm = Math.round((h % 1) * 60);
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  };
  const moon = getMoonPhase(date);
  const coef = moon.illumination >= 70 ? (75 + (seed % 25)) : moon.illumination >= 30 ? (55 + (seed % 20)) : (35 + (seed % 20));
  
  return {
    coef,
    tides: [
      { time: fmt(baseHour), tipo: 'Alta', altura: (1.3 + moon.illumination * 0.005).toFixed(2) },
      { time: fmt(baseHour + 6.2), tipo: 'Baja', altura: '0.3' },
      { time: fmt(baseHour + 12.4), tipo: 'Alta', altura: (1.2 + moon.illumination * 0.004).toFixed(2) },
      { time: fmt(baseHour + 18.6), tipo: 'Baja', altura: '0.25' },
    ]
  };
}

function scoreWind(v) {
  if (v <= 10) return { label: `${Math.round(v)} km/h`, score: 10 };
  if (v <= 15) return { label: `${Math.round(v)} km/h`, score: 9 };
  if (v <= 20) return { label: `${Math.round(v)} km/h`, score: 7 };
  if (v <= 25) return { label: `${Math.round(v)} km/h`, score: 5 };
  return { label: `${Math.round(v)} km/h`, score: 2 };
}

function scoreWave(h) {
  const w = h || 0.5;
  if (w <= 0.3) return { label: `${w}m - Calma`, score: 9 };
  if (w <= 0.6) return { label: `${w}m - Leve`, score: 8 };
  if (w <= 1.0) return { label: `${w}m - Moderada`, score: 6 };
  if (w <= 1.5) return { label: `${w}m - Fuerte`, score: 3 };
  return { label: `${w}m - Muy fuerte`, score: 1 };
}

function scoreLabel(s) {
  if (s >= 8) return { text: 'Excelente', cls: 'score-9' };
  if (s >= 6) return { text: 'Bueno', cls: 'score-7' };
  if (s >= 4) return { text: 'Regular', cls: 'score-5' };
  return { text: 'Malo', cls: 'score-3' };
}

function toggleDay(id) {
  document.getElementById(id).classList.toggle('expanded');
}

async function renderForecast() {
  try {
    const data = await loadWeather();
    const days = [];
    
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const moon = getMoonPhase(d);
      const wind = scoreWind(data.daily.wind_speed_10m_max[i]);
      const wave = scoreWave(data.daily.wave_height_max[i]);
      const total = Math.round(wind.score * 0.35 + moon.score * 0.35 + wave.score * 0.30);
      const lbl = scoreLabel(total);
      
      days.push({
        date: d,
        dayName: DAYS[d.getDay()],
        dateLabel: `${d.getDate()} ${MONTHS[d.getMonth()]}`,
        moon, wind, wave, total, lbl,
        tides: getTides(d),
        sun: getSunRiseSet(d),
        moonRiseSet: getMoonRiseSet(d)
      });
    }
    
    const best = days.reduce((a, b) => b.total > a.total ? b : a);
    
    let html = `<div class="card"><div class="best-badge">⭐ Mejor día</div>
      <div style="font-size:2rem;margin-bottom:0.3rem">${best.moon.icon}</div>
      <div class="card-title">${best.dayName}</div>
      <div style="font-size:0.85rem;color:#888">${best.dateLabel}</div>
      <div class="card-score">${best.total}<span style="font-size:1rem;font-weight:400">/10</span></div>
      <div style="color:#1a7abf;font-weight:600;margin:0.5rem 0">${best.lbl.text}</div>
      <div class="factors">
        <div class="factor"><span class="factor-val">${best.wind.label}</span>🌬️ Viento</div>
        <div class="factor"><span class="factor-val">${best.wave.label}</span>🌊 Oleaje</div>
        <div class="factor"><span class="factor-val">${best.moon.illumination}%</span>${best.moon.icon} Luna</div>
      </div>
      <div class="sun-row">
        <div class="sun-item">🌅 ${best.sun.rise}</div>
        <div class="sun-item">🌇 ${best.sun.set}</div>
      </div>
      <div class="moon-row">
        <div class="moon-item">🌙 Sale: ${best.moonRiseSet.rise}</div>
        <div class="moon-item">🌙 Se pone: ${best.moonRiseSet.set}</div>
      </div>
    </div>`;
    
    html += '<div class="section-title">📅 Próximos 7 días</div>';
    
    days.forEach((d, i) => {
      html += `<div class="day-item${d === best ? ' best' : ''}" id="day-${i}" onclick="toggleDay('day-${i}')">
        <div class="day-header">
          <div class="day-info">
            <div class="day-name">${d.dayName}${d === best ? ' ⭐' : ''}</div>
            <div class="day-date">${d.dateLabel}</div>
            <div class="day-factors">
              <span class="factor-tag">${d.wind.label}</span>
              <span class="factor-tag">${d.wave.label}</span>
              <span class="factor-tag">${d.moon.illumination}% ${d.moon.icon}</span>
            </div>
          </div>
          <div class="day-score ${d.lbl.cls}">${d.total}</div>
        </div>
        <div class="details">
          <strong>🌊 Mareas:</strong><br/>
          ${d.tides.tides.map(t => `<div class="tide-row">${t.tipo === 'Alta' ? '▲' : '▼'} <span class="tide-val">${t.time}</span> - ${t.altura}m</div>`).join('')}
          <strong>📊 Coeficiente:</strong> <span class="tide-val">${d.tides.coef}</span> (${d.tides.coef >= 70 ? 'Viva' : d.tides.coef >= 50 ? 'Media' : 'Muerta'})<br/>
          <strong>☀️ Sol:</strong> 🌅 ${d.sun.rise} - 🌇 ${d.sun.set}<br/>
          <strong>🌙 Luna:</strong> Sale ${d.moonRiseSet.rise} - Se pone ${d.moonRiseSet.set} (${d.moon.illumination}% - ${d.moon.name})
        </div>
      </div>`;
    });
    
    document.getElementById('forecast').innerHTML = html;
  } catch (e) {
    document.getElementById('forecast').innerHTML = `<div class="error">⚠️ Error cargando datos: ${e.message}</div>`;
  }
}

function renderSpots() {
  const spots = [
    {num: 1, name: 'El Cóndor ⭐', desc: 'Playa abierta con buen acceso. Excelente para pejerrey de mar en cambios de marea.', stars: 5, type: 'Playa atlántica'},
    {num: 2, name: 'El Espigón', desc: 'Estructura rocosa que concentra cardúmenes de pejerrey. Ideal con cucharita.', stars: 4, type: 'Playa rocosa'},
    {num: 3, name: 'Playa Bonita', desc: 'Playa tranquila con fondo arenoso. Agua clara, perfecta para flotador.', stars: 4, type: 'Playa'},
    {num: 4, name: 'La Ensenada', desc: 'Zona resguardada del viento. Refugio de pejerrey en días de marejada.', stars: 4, type: 'Ensenada'},
    {num: 5, name: 'Bahía Creek', desc: 'Bahía mixta (agua dulce-salada). Muy activa en pleamar, paso de cardúmenes.', stars: 4, type: 'Bahía'},
  ];
  
  let html = '<div class="section-title">🗺️ Mejores playas para pejerrey</div>';
  spots.forEach(s => {
    const stars = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
    html += `<div class="spot-item">
      <div class="spot-num${s.num === 1 ? ' best' : ''}">${s.num}</div>
      <div>
        <div class="spot-name">${s.name}</div>
        <div class="spot-desc">${s.desc}</div>
        <div class="spot-type">${s.type}</div>
      </div>
      <div><div class="stars">${stars}</div></div>
    </div>`;
  });
  
  document.getElementById('spots').innerHTML = html;
}

function renderBait() {
  const conds = {agua: 'clara', viento: 'calmo', tipo: 'mar'};
  
  let html = `<div class="conditions">
    <div class="cond-group">
      <div class="cond-label">Agua</div>
      <div class="btns">
        <button class="btn active" onclick="updateBait('agua','clara',this)">Clara</button>
        <button class="btn" onclick="updateBait('agua','turbia',this)">Turbia</button>
        <button class="btn" onclick="updateBait('agua','fria',this)">Fría</button>
      </div>
    </div>
    <div class="cond-group">
      <div class="cond-label">Viento</div>
      <div class="btns">
        <button class="btn active" onclick="updateBait('viento','calmo',this)">Calmo</button>
        <button class="btn" onclick="updateBait('viento','moderado',this)">Moderado</button>
        <button class="btn" onclick="updateBait('viento','fuerte',this)">Fuerte</button>
      </div>
    </div>
    <div class="cond-group">
      <div class="cond-label">Tipo de pesca</div>
      <div class="btns">
        <button class="btn active" onclick="updateBait('tipo','mar',this)">Mar</button>
        <button class="btn" onclick="updateBait('tipo','laguna',this)">Laguna</button>
      </div>
    </div>
  </div>
  
  <div class="carnada-list" id="baits"></div>`;
  
  document.getElementById('bait').innerHTML = html;
  renderBaitList(conds);
}

function renderBaitList(conds) {
  const baits = [
    {icon: '🌽', name: 'Maíz cocido', why: 'Clásica pejerrey. Efectiva en mar y laguna.', tip: '2-3 granos, anzuelo 8-10', score: conds.agua === 'clara' ? 9 : 7},
    {icon: '🍞', name: 'Pan migado', why: 'Excelente en agua turbia o con marejada.', tip: 'Humedecer apenas, mezclar con ajo', score: conds.agua === 'turbia' ? 9 : 6},
    {icon: '🪱', name: 'Lombriz colorada', why: 'Ideal agua fría. Muy activa en invierno.', tip: 'Media lombriz, sin enroscar', score: conds.agua === 'fria' ? 9 : 6},
    {icon: '🥄', name: 'Cucharita plateada', why: 'Pesca activa, ideal con viento y corriente.', tip: 'Recuperación lenta, pequeñas sacudidas', score: conds.viento !== 'calmo' ? 8 : 5},
    {icon: '🎣', name: 'Lancita de plástico', why: 'Excelente agua clara. Imita pejerrey chico.', tip: 'Plateado o verde agua, profundidad media', score: conds.agua === 'clara' ? 8 : 5},
  ].sort((a, b) => b.score - a.score);
  
  let html = '<h3 style="font-size:0.95rem;font-weight:700;color:#1a7abf;margin-bottom:1rem">🪱 Carnadas recomendadas</h3>';
  baits.slice(0, 3).forEach((b, i) => {
    const rankClass = ['rank-1', 'rank-2', 'rank-3'][i];
    const labels = ['1°', '2°', '3°'];
    html += `<div class="carnada-item">
      <span class="carnada-rank ${rankClass}">${labels[i]}</span>
      <div style="flex:1">
        <div class="carnada-name">${b.icon} ${b.name}</div>
        <div class="carnada-why">${b.why}</div>
        <div class="carnada-tip">💡 ${b.tip}</div>
      </div>
    </div>`;
  });
  
  document.getElementById('baits').innerHTML = html;
}

function updateBait(group, value, btn) {
  btn.closest('.btns').querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const conds = {agua: 'clara', viento: 'calmo', tipo: 'mar'};
  conds[group] = value;
  renderBaitList(conds);
}

function switchTab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

renderSpots();
renderBait();
renderForecast();
</script>
