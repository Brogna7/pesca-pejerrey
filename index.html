<script>
const conds = { agua: 'clara', viento: 'calmo', momento: 'amanecer', tipo: 'rio' };

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector('#page-' + page).classList.add('active');

  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function selCond(btn) {
  const g = btn.dataset.g, v = btn.dataset.v;
  conds[g] = v;

  btn.closest('.cond-btns')
    .querySelectorAll('.cond-btn')
    .forEach(b => b.classList.remove('sel'));

  btn.classList.add('sel');
  renderCarnada();
}

const CARNADAS = [
  {
    name: 'Maíz cocido',
    icon: '🌽',
    score: c => {
      let s = 6;
      if (c.agua === 'clara') s += 2;
      if (c.tipo !== 'mar') s += 1;
      return s;
    },
    why: 'Clásico para río/laguna.',
    tip: 'Blando, 2-3 granos.'
  },
  {
    name: 'Pan',
    icon: '🍞',
    score: c => {
      let s = 5;
      if (c.agua === 'turbia') s += 2;
      if (c.viento === 'calmo') s += 1;
      return s;
    },
    why: 'Muy usado en el río.',
    tip: 'Humedecer apenas.'
  },
  {
    name: 'Lombriz',
    icon: '🪱',
    score: c => {
      let s = 5;
      if (c.agua === 'fria') s += 2;
      if (c.momento === 'noche') s += 2;
      return s;
    },
    why: 'Ideal en frío o noche.',
    tip: 'Media lombriz.'
  },
  {
    name: 'Cucharita',
    icon: '🥄',
    score: c => {
      let s = 4;
      if (c.tipo === 'mar') s += 3;
      if (c.viento !== 'calmo') s += 1;
      return s;
    },
    why: 'Para pesca activa.',
    tip: 'Recuperación lenta.'
  }
];

function renderCarnada() {
  const cont = document.getElementById('carnada-result');

  let list = CARNADAS.map(c => ({
    ...c,
    pts: c.score(conds)
  }));

  list.sort((a, b) => b.pts - a.pts);

  cont.innerHTML = `
    <h3>🎯 Mejores opciones</h3>
    ${list.map((c, i) => `
      <div class="carnada-item">
        <div class="carnada-rank rank-${i+1}">${i+1}</div>
        <div>
          <div class="carnada-name">${c.icon} ${c.name} (${c.pts}/10)</div>
          <div class="carnada-why">${c.why}</div>
          <div class="carnada-tip">${c.tip}</div>
        </div>
      </div>
    `).join('')}
  `;
}

// init
renderCarnada();
</script>
