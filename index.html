<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesca de Pejerrey</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(160deg,#e0f4fd 0%,#f0f8ff 60%,#fff8e7 100%);min-height:100vh;color:#1a3a4a}
header{background:linear-gradient(135deg,#1a7abf 0%,#2196c4 60%,#0d5f9a 100%);color:white;padding:2rem 1.5rem;text-align:center}
header h1{font-size:1.8rem;margin-bottom:0.5rem}
header p{font-size:0.9rem;opacity:0.9}
.badge{display:inline-block;margin-top:0.8rem;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:0.3rem 1rem;font-size:0.8rem;font-weight:600}
.tabs{display:flex;background:white;border-bottom:2px solid #b3e0f7;position:sticky;top:0;z-index:100}
.tab{flex:1;padding:1rem;font-size:0.85rem;font-weight:600;background:none;border:none;cursor:pointer;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;transition:0.2s}
.tab.active{color:#1a7abf;border-bottom-color:#1a7abf}
.container{max-width:700px;margin:0 auto;padding:1.5rem 1rem 3rem}
.page{display:none}
.page.active{display:block}
.card{background:white;border-radius:14px;border:2px solid #F4A825;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(244,168,37,0.1);text-align:center}
.card-title{font-size:1.2rem;font-weight:700;color:#1a7abf;margin:0.5rem 0}
.card-score{font-size:3rem;font-weight:800;color:#F4A825;line-height:1}
.section-title{font-size:1rem;font-weight:700;color:#1a7abf;margin:1.5rem 0 1rem}
.day-item{background:white;border:1.5px solid #b3e0f7;border-radius:12px;padding:1rem;margin-bottom:0.8rem;cursor:pointer}
.day-item:hover{box-shadow:0 4px 14px rgba(79,195,247,0.2)}
.day-header{display:flex;justify-content:space-between;align-items:center}
.day-name{font-weight:700;font-size:1rem}
.day-date{font-size:0.75rem;color:#888}
.day-score{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}
.score-9{background:#fff3cc;color:#b07c00}
.score-7{background:#d6f0fc;color:#1a7abf}
.score-5{background:#e8ede8;color:#4a6a4a}
.score-3{background:#ffe5e5;color:#b03a3a}
.details{margin-top:1rem;padding-top:1rem;border-top:1px solid #d0eaf7;display:none;font-size:0.85rem}
.day-item.expanded .details{display:block}
.spot-item{background:white;border:1.5px solid #b3e0f7;border-radius:12px;padding:1rem;margin-bottom:0.8rem;display:grid;grid-template-columns:40px 1fr auto;gap:1rem;align-items:start}
.spot-num{width:40px;height:40px;border-radius:50%;background:#1a7abf;color:white;font-weight:700;display:flex;align-items:center;justify-content:center}
.spot-name{font-weight:700;font-size:0.95rem;color:#1a3a4a}
.spot-desc{font-size:0.8rem;color:#666;margin-top:0.3rem;line-height:1.4}
.stars{color:#F4A825;font-size:0.9rem}
.conditions{background:white;border:1.5px solid #b3e0f7;border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.cond-group{margin-bottom:1rem}
.cond-label{font-size:0.75rem;font-weight:700;color:#1a7abf;margin-bottom:0.5rem}
.btns{display:flex;gap:0.4rem;flex-wrap:wrap}
.btn{padding:0.4rem 0.8rem;border:1.5px solid #b3e0f7;background:white;border-radius:20px;font-size:0.75rem;font-weight:600;color:#555;cursor:pointer;transition:0.2s}
.btn.active{background:#1a7abf;color:white;border-color:#1a7abf}
.carnada-list{background:white;border:2px solid #4FC3F7;border-radius:12px;padding:1.2rem}
.carnada-item{padding:0.8rem 0;border-bottom:1px solid #e8f4fb}
.carnada-item:last-child{border-bottom:none}
.carnada-rank{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;margin-right:0.8rem}
.rank-1{background:#fff3cc;color:#b07c00}
.rank-2{background:#d6f0fc;color:#1a7abf}
.rank-3{background:#e8ede8;color:#4a6a4a}
.carnada-name{font-weight:700;font-size:0.9rem;color:#1a3a4a}
.carnada-why{font-size:0.75rem;color:#666;margin-top:0.3rem}
.carnada-tip{font-size:0.75rem;color:#1a7abf;margin-top:0.2rem;font-style:italic}
footer{text-align:center;padding:1rem;font-size:0.7rem;color:#aaa}
</style>
</head>
<body>

<header>
  <div style="font-size:2.5rem;margin-bottom:0.5rem">🎣</div>
  <h1>Mejor Día para Pescar Pejerrey</h1>
  <p>Clima · Mareas · Spots · Carnada</p>
  <div class="badge">📍 Viedma, Río Negro</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('forecast')">📅 Pronóstico</button>
  <button class="tab" onclick="switchTab('spots')">🗺️ Spots</button>
  <button class="tab" onclick="switchTab('bait')">🪱 Carnada</button>
</div>

<div class="container">
  <div id="forecast" class="page active"></div>
  <div id="spots" class="page"></div>
  <div id="bait" class="page"></div>
</div>

<footer>Datos simulados · Spots: conocimiento local · Carnada: experiencia regional</footer>

<script>
const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function switchTab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function toggleDay(id) {
  document.getElementById(id).classList.toggle('expanded');
}

function getMoon(d) {
  const known = new Date(2000, 0, 6);
  const diff = (d - known) / 86400000;
  const phase = ((diff % 29.53) + 29.53) % 29.53;
  if (phase < 1.85 || phase >= 27.68) return {name: 'Luna nueva', icon: '🌑', score: 5};
  if (phase < 7.38) return {name: 'Cuarto crec.', icon: '🌒', score: 8};
  if (phase < 14.77) return {name: 'Luna llena', icon: '🌕', score: 10};
  return {name: 'Cuarto meng.', icon: '🌘', score: 8};
}

function getWind(i) {
  const w = 8 + Math.sin(i * 0.8) * 6;
  return {label: Math.round(w) + ' km/h', score: w <= 10 ? 10 : w <= 20 ? 7 : 3};
}

function getScore(wind, moon) {
  return Math.round(wind * 0.35 + moon * 0.35 + 8 * 0.30);
}

function renderForecast() {
  let html = '<div class="card"><div style="font-size:2.5rem;margin-bottom:0.3rem">⭐</div><div class="card-title">Mejor día de la semana</div><div style="font-size:0.9rem;color:#888;margin:0.5rem 0">Este fin de semana</div><div class="card-score">8<span style="font-size:1rem;font-weight:400">/10</span></div><div style="font-size:0.85rem;color:#1a7abf;margin:0.8rem 0">Excelente para pescar</div></div>';
  html += '<div class="section-title">📅 Próximos 7 días</div>';
  
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const moon = getMoon(d);
    const wind = getWind(i);
    const score = getScore(wind.score, moon.score);
    const scoreClass = score >= 8 ? 'score-9' : score >= 6 ? 'score-7' : score >= 4 ? 'score-5' : 'score-3';
    
    html += `<div class="day-item" id="day-${i}" onclick="toggleDay('day-${i}')">
      <div class="day-header">
        <div>
          <div class="day-name">${DAYS[d.getDay()]}${i===0 ? ' ⭐' : ''}</div>
          <div class="day-date">${d.getDate()} ${MONTHS[d.getMonth()]}</div>
        </div>
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;font-size:0.7rem">
          <span style="background:#e8f6fd;border-radius:20px;padding:0.2rem 0.5rem;color:#1a5f8a">${wind.label}</span>
          <span style="background:#e8f6fd;border-radius:20px;padding:0.2rem 0.5rem;color:#1a5f8a">${moon.icon}</span>
        </div>
        <div class="day-score ${scoreClass}">${score}</div>
      </div>
      <div class="details">
        <div><strong>Mareas:</strong> 06:30 Alta (1.2m) · 12:45 Baja (0.3m) · 19:00 Alta (1.1m)</div>
        <div style="margin-top:0.5rem"><strong>Coef:</strong> ${75 - Math.abs(i - 3) * 10} (${75 - Math.abs(i - 3) * 10 >= 70 ? 'Viva' : 'Media'})</div>
        <div style="margin-top:0.5rem"><strong>Sol:</strong> 🌅 06:45 · 🌇 19:15 · 🟡 Hora dorada: 06:50-07:50</div>
      </div>
    </div>`;
  }
  
  document.getElementById('forecast').innerHTML = html;
}

function renderSpots() {
  const spots = [
    {num: 1, name: 'El Cóndor ⭐', desc: 'Costa atlántica a 30 km. Pejerrey de mar de gran tamaño.', stars: 5, type: 'Mar'},
    {num: 2, name: 'El Espigón', desc: 'Estructura sobre el río que concentra cardúmenes.', stars: 4, type: 'Río'},
    {num: 3, name: 'Playa Bonita', desc: 'Playa tranquila con agua clara, ideal con flotador.', stars: 4, type: 'Playa'},
    {num: 4, name: 'La Ensenada', desc: 'Zona protegida del viento, refugio en días ventosos.', stars: 4, type: 'Ensenada'},
    {num: 5, name: 'Bahía Creek', desc: 'Mezcla agua dulce y salada. Activa en pleamar.', stars: 4, type: 'Bahía'},
  ];
  
  let html = '';
  spots.forEach(s => {
    const stars = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
    html += `<div class="spot-item"><div class="spot-num">${s.num}</div><div><div class="spot-name">${s.name}</div><div class="spot-desc">${s.desc}</div></div><div style="text-align:right"><div class="stars">${stars}</div><div style="font-size:0.7rem;color:#888">${s.type}</div></div></div>`;
  });
  
  document.getElementById('spots').innerHTML = html;
}

function renderBait() {
  const conds = {agua: 'clara', viento: 'calmo', tipo: 'rio'};
  
  let html = `<div class="conditions">
    <div class="cond-group">
      <div class="cond-label">Agua</div>
      <div class="btns">
        <button class="btn active" onclick="updateBait('agua','clara',this)">Clara</button>
        <button class="btn" onclick="updateBait('agua','turbia',this)">Turbia</button>
        <button class="btn" onclick="updateBait('agua','fria',this)">Fría</button>
      </div>
    </div>
    <div class="cond-group">
      <div class="cond-label">Viento</div>
      <div class="btns">
        <button class="btn active" onclick="updateBait('viento','calmo',this)">Calmo</button>
        <button class="btn" onclick="updateBait('viento','moderado',this)">Moderado</button>
        <button class="btn" onclick="updateBait('viento','fuerte',this)">Fuerte</button>
      </div>
    </div>
    <div class="cond-group">
      <div class="cond-label">Tipo de pesca</div>
      <div class="btns">
        <button class="btn active" onclick="updateBait('tipo','rio',this)">Río</button>
        <button class="btn" onclick="updateBait('tipo','mar',this)">Mar</button>
        <button class="btn" onclick="updateBait('tipo','laguna',this)">Laguna</button>
      </div>
    </div>
  </div>
  
  <div class="carnada-list" id="baits"></div>`;
  
  document.getElementById('bait').innerHTML = html;
  renderBaitList(conds);
}

function renderBaitList(conds) {
  const baits = [
    {icon: '🌽', name: 'Maíz cocido', why: 'Clásica y efectiva.', tip: '2-3 granos en anzuelo del 10.', score: conds.agua === 'clara' ? 8 : 6},
    {icon: '🍞', name: 'Pan migado', why: 'Ideal en agua turbia.', tip: 'Humedecer apenas.', score: conds.agua === 'turbia' ? 8 : 5},
    {icon: '🪱', name: 'Lombriz', why: 'Excelente en agua fría.', tip: 'Media lombriz sin enroscar.', score: conds.agua === 'fria' ? 9 : 5},
    {icon: '🥄', name: 'Cucharita', why: 'Pesca activa con corriente.', tip: 'Recuperación lenta.', score: conds.viento !== 'calmo' ? 8 : 5},
  ].sort((a,b) => b.score - a.score);
  
  let html = '<h3 style="font-size:0.95rem;font-weight:700;color:#1a7abf;margin-bottom:1rem">🪱 Recomendadas</h3>';
  baits.slice(0, 3).forEach((b, i) => {
    const rankClass = ['rank-1', 'rank-2', 'rank-3'][i];
    const labels = ['1°', '2°', '3°'];
    html += `<div class="carnada-item">
      <span class="carnada-rank ${rankClass}">${labels[i]}</span>
      <div style="flex:1">
        <div class="carnada-name">${b.icon} ${b.name}</div>
        <div class="carnada-why">${b.why}</div>
        <div class="carnada-tip">💡 ${b.tip}</div>
      </div>
    </div>`;
  });
  
  document.getElementById('baits').innerHTML = html;
}

function updateBait(group, value, btn) {
  btn.closest('.btns').querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const conds = {agua: 'clara', viento: 'calmo', tipo: 'rio'};
  conds[group] = value;
  renderBaitList(conds);
}

renderForecast();
renderSpots();
renderBait();
</script>
</body>
</html>
